# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews pull requests. The project rules it should hold PRs to live in AGENTS.md
# (code) and CLAUDE.md (workflow); the path notes below point it at the rules most often missed.
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!pnpm-lock.yaml"
    - "!apps/api/drizzle/meta/**"
  path_instructions:
    - path: "packages/shared/src/**"
      instructions: |
        This is the wire contract used by shipped editor extensions. Flag any change that isn't
        additive (removed or renamed fields, tightened limits, new required fields) unless the PR
        explains the versioning plan. Every contract change needs a matching docs/api.md update.
    - path: "apps/api/src/routes/**"
      instructions: |
        Handlers stay thin: validate with validate(), call a service, return JSON. Business logic
        belongs in src/services. Use c.var.deps.now(), never new Date(). Errors are thrown as
        AppError and use the { error: { code, message } } envelope. No CORS middleware.
    - path: "apps/api/src/**"
      instructions: |
        ESM with NodeNext: relative imports need the .js extension. Store only SHA-256 hashes of
        tokens and keys. Never log API keys, session tokens or request bodies. Any new write to
        coding_sessions must go through ingestSessions (per-user advisory lock, overlap rule).
    - path: "apps/api/src/db/schema.ts"
      instructions: |
        Schema changes need a generated migration (pnpm db:generate) in the same PR and a
        docs/data-model.md update. Migrations must be rollback-safe: the previous API version has
        to keep working against the new schema (add nullable/defaulted columns; drop later).
    - path: "apps/api/drizzle/*.sql"
      instructions: |
        Generated by drizzle-kit. Flag hand edits and any change to a migration that is already on
        main. Check that destructive statements follow expand → migrate → contract.
    - path: "apps/api/test/**"
      instructions: |
        Tests run against real Postgres: no database mocks. They must be deterministic (fixed NOW,
        fakeGithub(), no sleeps), assert exact values rather than only status codes, and cover the
        failure path. Flag weakened assertions, .skip or raised timeouts.
    - path: "apps/web/src/**"
      instructions: |
        Next.js 16: cookies(), headers(), params and searchParams are async. Server components
        fetch through src/lib/api.server.ts, client components through api() in api.client.ts.
        Use the design tokens from globals.css, never hardcoded colours; both light and dark must
        work. Reuse src/components/ui.tsx primitives. Check accessibility: labels, roles, keyboard.
    - path: ".github/workflows/**"
      instructions: |
        Keep permissions minimal, pin third-party actions (a commit SHA outside actions/* and
        docker/*), never echo secrets, and never add continue-on-error to required steps.
    - path: "docs/adr/**"
      instructions: |
        Accepted ADRs are never rewritten; a change of decision is a new ADR that supersedes it.
chat:
  auto_reply: true
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "CLAUDE.md"
